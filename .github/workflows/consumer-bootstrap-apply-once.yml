name: Consumer Bootstrap Apply Once

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: consumer-bootstrap-apply-once-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.head_ref == 'integration/52-domain-decoupling-bootstrap-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Checkout exact skills-shared source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ed3c/skills-shared
          ref: ccef97dedd7ea8b1873e3afa130ca82b8eabb413
          path: .shared-skills-source
          fetch-depth: 1
          persist-credentials: false
      - name: Run canonical bootstrap apply
        run: |
          python3 .shared-skills-source/skills/shared-skills-infra/scripts/consumer_bootstrap.py \
            --consumer "$GITHUB_WORKSPACE" \
            --repository-id ed3c/website-design-compiler \
            --apply
      - name: Refuse unexpected writes and publish non-workflow generated bytes
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .shared-skills-source
          # GitHub App tokens cannot modify workflow files without the dedicated
          # workflows permission. Preserve the exact generated workflow bytes in
          # the receipt, remove only that file from this branch-scoped commit,
          # and let the GitHub connector install the same canonical bytes later.
          rm -f .github/workflows/domain-decoupling-bootstrap.yml
          allowed='^(README\.md|AGENTS\.md|CLAUDE\.md|CONTEXT\.md|ARCHITECTURE\.md|docs/INDEX\.md|docs/architecture/(AGENTS|DOCUMENT_ROUTING|STATE_MACHINES|DOMAIN_DECOUPLING)\.md|docs/integration/CROSS_REPO_INTEGRATION\.md|docs/traceability/TRACEABILITY_INDEX\.md|\.agents/README\.md|\.agents/control-plane/(README\.md|source\.json|profile\.json|requirements\.json|bootstrap-receipt\.json)|\.agents/bindings/repository-control-plane\.json)$'
          unexpected="$(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected bootstrap writes:\n%s\n' "$unexpected" >&2
            exit 2
          fi
          git add README.md AGENTS.md CLAUDE.md CONTEXT.md ARCHITECTURE.md \
            docs/INDEX.md docs/architecture/AGENTS.md docs/architecture/DOCUMENT_ROUTING.md \
            docs/architecture/STATE_MACHINES.md docs/architecture/DOMAIN_DECOUPLING.md \
            docs/integration/CROSS_REPO_INTEGRATION.md docs/traceability/TRACEABILITY_INDEX.md \
            .agents/README.md .agents/control-plane .agents/bindings/repository-control-plane.json
          if git diff --cached --quiet; then
            echo 'Canonical non-workflow bootstrap bytes already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: materialize Domain Decoupling bootstrap' \
            -m 'Generated by skills-shared consumer_bootstrap.py --apply.' \
            -m 'Workflow adapter installed separately by GitHub connector due to workflows permission boundary.' \
            -m 'Driven-By: agent-macro' \
            -m 'Driven-On: github-actions'
          git push origin "HEAD:$HEAD_REF"
