name: compiler-core

on:
  push:
    branches:
      - agent/bootstrap-website-design-compiler
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm compile:fixture
      - name: Bind exact head receipt
        run: |
          node -e 'const fs=require("fs"); const p="artifacts/runtime/minimal/runtime-receipt.json"; const r=JSON.parse(fs.readFileSync(p,"utf8")); r.git={sha:process.env.GITHUB_SHA,ref:process.env.GITHUB_REF}; fs.writeFileSync(p,JSON.stringify(r,null,2)+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-core-receipt-${{ github.sha }}
          path: artifacts/runtime/minimal/runtime-receipt.json
          if-no-files-found: error
