# GENERATED BY DOMAIN-DECOUPLING-V1 CONSUMER BOOTSTRAP
name: Domain Decoupling Consumer Bootstrap

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - '.agents/control-plane/**'
      - '.agents/bindings/repository-control-plane.json'
      - '.github/workflows/domain-decoupling-bootstrap.yml'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTEXT.md'
      - 'ARCHITECTURE.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain-decoupling-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned validator
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
      - name: Resolve immutable shared source
        id: source
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse
          value = json.loads(Path('.agents/control-plane/source.json').read_text())
          source = value['source']
          slug = urlparse(source['repository']).path.strip('/').removesuffix('.git')
          if slug != 'ed3c/skills-shared':
              raise SystemExit(f'unexpected shared repository: {slug}')
          # public-consumer-private-import (check_skill_bootstrap.py) needs an
          # honest canonical_visibility, not a guess. Ask GitHub's own API for
          # the one fact that answers it. Any failure to observe (network,
          # non-200, malformed body) stays conservative: PRIVATE, never PUBLIC.
          canonical_visibility = 'PRIVATE'
          try:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{slug}',
                  headers={'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  payload = json.loads(response.read())
              if isinstance(payload.get('private'), bool):
                  canonical_visibility = 'PRIVATE' if payload['private'] else 'PUBLIC'
          except Exception:
              pass
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f"repository={slug}", file=output)
              print(f"commit={source['commit']}", file=output)
              print(f"canonical_visibility={canonical_visibility}", file=output)
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: .shared-skills-source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact consumer bootstrap
        env:
          CONSUMER_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .shared-skills-source/skills/shared-skills-infra/scripts/consumer_bootstrap.py \
            --consumer "$GITHUB_WORKSPACE" \
            --repository-id "$CONSUMER_REPOSITORY" \
            --check
      - name: Observe task-bound runtime admission
        env:
          CONSUMER_REPOSITORY: ${{ github.repository }}
          CONSUMER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CONSUMER_VISIBILITY: ${{ github.event.repository.private && 'PRIVATE' || 'PUBLIC' }}
          CANONICAL_VISIBILITY: ${{ steps.source.outputs.canonical_visibility }}
        run: |
          python3 .shared-skills-source/skills/shared-skills-infra/scripts/observe_consumer_runtime.py \
            --consumer "$GITHUB_WORKSPACE" \
            --shared-root "$GITHUB_WORKSPACE/.shared-skills-source" \
            --repository-id "$CONSUMER_REPOSITORY" \
            --expected-consumer-sha "$CONSUMER_SHA" \
            --consumer-visibility "$CONSUMER_VISIBILITY" \
            --canonical-visibility "$CANONICAL_VISIBILITY" \
            --output "$RUNNER_TEMP/skill-resolution-receipt.json"
